name: Local Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/ru-exercise-aliases
    paths:
      - 'frontend/**'
      - 'scripts/fetch-mobile-media.sh'
      - '.github/workflows/android-offline.yml'

permissions:
  contents: read

concurrency:
  group: android-offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run offline frontend tests
        working-directory: frontend
        # coach.test.js imports the server-side Anthropic SDK. The offline APK has no Coach/backend.
        run: npx vitest run --exclude src/lib/coach.test.js

      - name: Build local-first Capacitor bundle
        working-directory: frontend
        run: npm run build:mobile

      - name: Verify no runtime CDN URLs leaked into bundle
        run: |
          if grep -R -n -E 'https?://[^"[:space:]]*cdn\.jsdelivr\.net|https?://[^"[:space:]]*github\.com/hasaneyldrm/exercises-dataset' frontend/dist --exclude='*.map'; then
            echo "Runtime exercise-media CDN URL found in local bundle" >&2
            exit 1
          fi

      - name: Decode stable release keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > frontend/android/app/release.keystore

      - name: Show release certificate SHA-1
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          keytool -list -v \
            -keystore frontend/android/app/release.keystore \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -alias "${{ secrets.ANDROID_KEY_ALIAS }}" | grep -E 'SHA1:'

      - name: Build signed release APK
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: frontend/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/frontend/android/app/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Build debug APK fallback
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 == '' }}
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        run: |
          if [ -f frontend/android/app/build/outputs/apk/release/app-release.apk ]; then
            cp frontend/android/app/build/outputs/apk/release/app-release.apk openGym-RU-local.apk
          else
            cp frontend/android/app/build/outputs/apk/debug/app-debug.apk openGym-RU-local.apk
          fi

      - name: Verify Google Drive network permission
        run: |
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          if [ -z "$AAPT" ]; then
            echo "aapt not found" >&2
            exit 1
          fi
          "$AAPT" dump permissions openGym-RU-local.apk | grep -q 'android.permission.INTERNET'

      - uses: actions/upload-artifact@v4
        with:
          name: openGym-RU-local
          path: openGym-RU-local.apk
          if-no-files-found: error
          retention-days: 30
