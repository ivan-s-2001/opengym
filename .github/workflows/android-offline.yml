name: Offline Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/ru-exercise-aliases
    paths:
      - 'frontend/**'
      - 'scripts/fetch-mobile-media.sh'
      - '.github/workflows/android-offline.yml'

permissions:
  contents: read

concurrency:
  group: android-offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test Russian catalogue
        working-directory: frontend
        run: npx vitest run src/lib/ru-exercises.test.js

      - name: Build fully offline Capacitor bundle
        working-directory: frontend
        run: npm run build:mobile

      - name: Verify no CDN URLs leaked into bundle
        run: |
          if grep -R -n -E 'cdn\.jsdelivr\.net|hasaneyldrm/exercises-dataset' frontend/dist --exclude='*.map'; then
            echo "Network media URL found in offline bundle" >&2
            exit 1
          fi

      - name: Build installable debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: cp frontend/android/app/build/outputs/apk/debug/app-debug.apk openGym-RU-offline.apk

      - uses: actions/upload-artifact@v4
        with:
          name: openGym-RU-offline
          path: openGym-RU-offline.apk
          if-no-files-found: error
          retention-days: 30
