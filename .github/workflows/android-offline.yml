name: Offline Android APK
# Re-run marker: locale blocks repaired

on:
  workflow_dispatch:
  push:
    branches:
      - feature/ru-exercise-aliases
    paths:
      - 'frontend/**'
      - 'scripts/fetch-mobile-media.sh'
      - '.github/workflows/android-offline.yml'

permissions:
  contents: read

concurrency:
  group: android-offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run offline frontend tests
        working-directory: frontend
        # coach.test.js imports the server-side Anthropic SDK. The offline APK has no Coach/backend.
        run: npx vitest run --exclude src/lib/coach.test.js

      - name: Build fully offline Capacitor bundle
        working-directory: frontend
        run: npm run build:mobile

      - name: Verify no runtime CDN URLs leaked into bundle
        run: |
          if grep -R -n -E 'https?://[^"[:space:]]*cdn\.jsdelivr\.net|https?://[^"[:space:]]*github\.com/hasaneyldrm/exercises-dataset' frontend/dist --exclude='*.map'; then
            echo "Runtime exercise-media URL found in offline bundle" >&2
            exit 1
          fi

      - name: Build installable debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify packaged APK has no Internet permission
        run: |
          APK='frontend/android/app/build/outputs/apk/debug/app-debug.apk'
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          if [ -z "$AAPT" ]; then
            echo "aapt not found" >&2
            exit 1
          fi
          if "$AAPT" dump permissions "$APK" | grep -q 'android.permission.INTERNET'; then
            echo "INTERNET permission present in packaged APK — offline-only invariant failed" >&2
            exit 1
          fi

      - name: Rename APK
        run: cp frontend/android/app/build/outputs/apk/debug/app-debug.apk openGym-RU-offline.apk

      - uses: actions/upload-artifact@v4
        with:
          name: openGym-RU-offline
          path: openGym-RU-offline.apk
          if-no-files-found: error
          retention-days: 30
