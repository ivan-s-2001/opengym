name: Android APK

on:
  push:
    branches:
      - feat/trainer-subscription-planner
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build mobile bundle
        working-directory: frontend
        run: npm run build:mobile

      - name: Build installable APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Collect APK
        run: |
          mkdir -p out
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk out/openGym-local-trainer-planner.apk

      - uses: actions/upload-artifact@v4
        with:
          name: openGym-local-trainer-planner
          path: out/openGym-local-trainer-planner.apk
          if-no-files-found: error
          retention-days: 14
